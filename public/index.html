<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>escalaX</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>escala<span>X</span></h1>
    <p>Edição e exportação em massa de reels</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Template</h2>
      <div class="grid">
        <label>Nome (linha de cima)
          <input id="tplName" type="text" placeholder="Ex: João Silva" />
        </label>
        <label>@ (transparente, embaixo do nome)
          <input id="tplHandle" type="text" placeholder="Ex: joaosilva" />
        </label>
        <label class="full">Título (aparece sobre o vídeo)
          <input id="tplTitle" type="text" placeholder="Título do vídeo" />
        </label>
        <label>Logo / Avatar (PNG, vira circular)
          <input id="logoFile" type="file" accept="image/png" />
        </label>
        <label>Marca d'água (PNG transparente)
          <input id="wmFile" type="file" accept="image/png" />
        </label>
        <label>Fundo
          <select id="pageBackground">
            <option value="black">Preto</option>
            <option value="white">Branco</option>
            <option value="dim">Escuro azulado</option>
          </select>
        </label>
        <label>Formato do vídeo
          <select id="videoBoxAspect">
            <option value="1:1">Quadrado (1:1)</option>
            <option value="4:5">Retrato (4:5)</option>
            <option value="16:9">Paisagem (16:9)</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label class="switch"><input id="overlayText" type="checkbox" checked /> Mostrar logo/nome/@/título</label>
        <label class="switch"><input id="invert" type="checkbox" /> Inverter vídeo (espelhar)</label>
        <label class="switch"><input id="wmEnabled" type="checkbox" /> Aplicar marca d'água em massa</label>
        <label class="switch"><input id="verified" type="checkbox" /> Selo de verificado</label>
        <label>Cor do selo
          <select id="verifiedColor">
            <option value="blue">Azul</option>
            <option value="gold">Dourado</option>
            <option value="silver">Prata</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Posição da marca d'água
          <select id="wmPosition">
            <option value="bottom-right">Inferior direita</option>
            <option value="bottom-left">Inferior esquerda</option>
            <option value="top-right">Superior direita</option>
            <option value="top-left">Superior esquerda</option>
            <option value="center">Centro</option>
          </select>
        </label>
        <label>Opacidade
          <input id="wmOpacity" type="range" min="0.1" max="1" step="0.05" value="0.6" />
        </label>
      </div>

      <div class="row">
        <button id="exportTpl">Exportar template (.json)</button>
        <label class="filebtn">Importar template
          <input id="importTpl" type="file" accept="application/json" hidden />
        </label>
      </div>
    </section>

    <section class="card">
      <h2>2. Vídeos</h2>
      <div id="dropzone" class="dropzone">
        Arraste os vídeos aqui ou <label class="filebtn">escolha os arquivos
          <input id="videoFiles" type="file" accept="video/*" multiple hidden />
        </label>
        <small>Suporta subir e processar até 100 vídeos de uma vez</small>
      </div>
      <div id="list"></div>
    </section>

    <section class="card actions">
      <button id="processBtn" disabled>Processar em massa</button>
      <button id="zipBtn" disabled>Baixar tudo (.zip)</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
